name: Scrape Gov Job Announcements

on:
  schedule:
    # รันทุกวัน เวลา 07:00 น. เวลาไทย (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # ให้กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || git commit -m "อัปเดตข้อมูลประกาศสอบราชการ [skip ci]"
          git push
